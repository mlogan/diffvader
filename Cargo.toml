[package]
name = "diffvader"
version = "0.4.0"
edition = "2021"
description = "Fast graphical side-by-side diff viewer for macOS, usable as a git difftool"
license = "MIT"

[dependencies]
wgpu = { version = "30", default-features = false, features = ["metal", "wgsl"] }
winit = "0.30"
imara-diff = "0.2"
fontdue = "0.9"
pollster = "0.4"
bytemuck = { version = "1", features = ["derive"] }
libc = "0.2"
memmap2 = "0.9"
memchr = "2"
unicode-width = "0.2"
# Same versions winit uses, so these add no compile time; needed only for the Dock icon.
objc2 = "0.5"
objc2-app-kit = { version = "0.2", features = [
    "NSApplication",
    "NSColor",
    "NSImage",
    "NSResponder",
    "NSView",
    "NSWindow",
] }
objc2-foundation = { version = "0.2", features = ["NSData"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
debug = 1

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[dev-dependencies]
tree-sitter = "0.27"
tree-sitter-highlight = "0.27"
tree-sitter-javascript = "0.25"
tree-sitter-rust = "0.24"
tree-sitter-typescript = "0.23"
